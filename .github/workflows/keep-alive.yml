name: Keep Streamlit Dashboard Awake

on:
  schedule:
    - cron: "0 6 * * *"   # Run once daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keep-alive-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update keep-alive timestamp
        run: |
          mkdir -p .github/keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive/last-ping.txt

      - name: Commit and push timestamp update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive/last-ping.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: keep-alive timestamp update"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi
